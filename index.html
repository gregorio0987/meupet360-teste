<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MeuPet 360 • MVP Comercial M25 Saúde Mobile</title>
<style>
:root{--g:#0b3c30;--g2:#1f6a53;--o:#f08a24;--bg:#f4f1ea;--card:#fff;--mint:#e6f1eb;--mint2:#d9ebe2;--text:#17362b;--muted:#6c7971;--line:#d6e3dc;--red:#b54848;--yellow:#fff1dc;--blue:#dff0ef;--cream:#fbf7ef}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at top right,#eef6f2 0,#f7f3ec 36%,#f2eee6 100%);color:var(--text)}
button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0b3c30 0%,#0b3329 62%,#09291f 100%);color:#fff;padding:30px 18px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:950;margin:2px 12px 8px;letter-spacing:-.04em}.brand span{color:var(--o);font-weight:950}
.brand-sub{font-size:11px;color:#bcd2c8;margin:0 12px 26px;line-height:1.45}nav button{width:100%;border:0;background:transparent;color:#d8e7df;padding:14px 15px;border-radius:14px;text-align:left;margin:5px 0;cursor:pointer;font-weight:800;transition:.18s}
nav button:hover,nav button.active{background:linear-gradient(90deg,#ffffff1f,#ffffff10);color:#fff;box-shadow:inset 3px 0 0 var(--o)}.main{padding:36px;max-width:1340px;width:100%;margin:auto}
.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.top h1{margin:0;font-size:32px;letter-spacing:-.035em;color:var(--g);font-weight:950}.sub{color:var(--muted);margin-top:5px}
.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--o);color:#fff}.secondary{background:var(--mint);color:var(--g)}.ghost{background:#fff;border:1px solid var(--line);color:var(--g)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:rgba(255,255,255,.96);border:1px solid #d7e4dd;border-radius:24px;padding:22px;box-shadow:0 12px 32px #17362b10;backdrop-filter:blur(3px)}.hero{grid-column:span 2;display:flex;gap:26px;align-items:center;background:linear-gradient(135deg,#0f4a3a 0%,#1f6a53 100%);padding:28px;border:none;color:white;position:relative;overflow:hidden}.hero:after{content:'🐾';position:absolute;right:18px;bottom:-12px;font-size:94px;opacity:.08}
.avatar{width:112px;height:112px;border-radius:50%;background:var(--mint2);object-fit:cover;display:grid;place-items:center;font-size:40px;border:4px solid #fff;box-shadow:0 0 0 1px var(--line)}
.label{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--g2);font-weight:950;line-height:1.25}.value{font-size:29px;font-weight:950;margin-top:9px;line-height:1.12;color:var(--text)}.petname{font-family:Georgia,'Times New Roman',serif;font-size:44px;font-weight:700;margin:2px 0 8px;letter-spacing:-.025em;line-height:1.02;color:#fff}.badge{display:inline-block;background:#ffffff20;color:#fff;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:850;border:1px solid #ffffff24}
.section{margin-top:26px}.section h2{font-size:20px;margin:0 0 14px;letter-spacing:-.02em}
.metric{position:relative;overflow:hidden}.metric:before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--o)}
.metric.mint:before{background:#49a675}.metric.blue:before{background:#4d9f9b}.metric.gold:before{background:#e3a63a}
.section-surface{background:rgba(255,255,255,.5);border:1px solid #e2e9e4;border-radius:26px;padding:20px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.action{background:linear-gradient(180deg,#fff,#fbfdfc);border:1px solid var(--line);border-radius:17px;padding:18px;text-align:left;font-weight:900;cursor:pointer;box-shadow:0 6px 18px #17362b08;min-height:72px}.action:hover{border-color:var(--o);transform:translateY(-1px)}
.formcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:850;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}.field textarea{min-height:86px;resize:vertical}.full{grid-column:1/-1}.mini-title{font-size:14px;font-weight:900;color:var(--g);margin:4px 0 12px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{background:var(--mint);color:var(--g)}
.empty{color:var(--muted);font-style:italic}.row-actions button{border:0;background:none;font-weight:800;color:var(--g);cursor:pointer}.row-actions .del{color:var(--red)}
.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:18px;z-index:20}.modal.open{display:grid}.modalbox{background:var(--bg);width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:21px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:none;font-size:26px;cursor:pointer}
.toast{position:fixed;right:20px;bottom:20px;background:var(--g);color:#fff;padding:13px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}
.note{background:var(--yellow);border:1px solid #ecd4aa;border-radius:14px;padding:14px;color:#76511e}
.alert-card{border-left:6px solid var(--line)}
.alert-green{background:#edf8f1;border-left-color:#3d9b62}.alert-yellow{background:#fff8dc;border-left-color:#d8ae25}
.alert-orange{background:#fff0df;border-left-color:#ed8d2d}.alert-red{background:#fff0f0;border-left-color:#d95353}.alert-today{background:#eaf7f6;border-left-color:#2c918c}
.status{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}
.status-green{background:#d9f0e1;color:#24643d}.status-yellow{background:#f9edb9;color:#765f13}.status-orange{background:#f8d9b8;color:#8b4d10}.status-red{background:#f6cccc;color:#8f2929}.status-today{background:#ccebea;color:#176762}
.emergency{background:linear-gradient(135deg,#fff,#f0f7f3);border:1px solid var(--line);border-radius:20px;padding:22px}
.emergency-name{font-family:Georgia,'Times New Roman',serif;font-size:34px;color:var(--g);font-weight:700;margin:4px 0 14px}
.em-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.em-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.em-item b{display:block;margin-top:4px}
@media(max-width:600px){.em-grid{grid-template-columns:1fr}}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pill{background:var(--mint);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--g)}
.welcome{background:linear-gradient(135deg,#103f33,#276f57);color:#fff;border-radius:26px;padding:26px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 14px 34px #17362b18}
.welcome:after{content:'🐾';position:absolute;right:24px;top:8px;font-size:72px;opacity:.09}.welcome h2{margin:0 0 6px;font-size:24px}.welcome p{margin:0;color:#d9e9e1;max-width:700px}
.progress{height:8px;background:#ffffff28;border-radius:99px;margin-top:15px;overflow:hidden}.progress span{display:block;height:100%;background:var(--o);border-radius:99px}
.attention-title{display:flex;align-items:center;gap:10px;font-size:21px!important;color:var(--g)}.attention-dot{width:10px;height:10px;border-radius:50%;background:var(--o)}
.smalllink{border:0;background:none;color:var(--g2);font-weight:800;cursor:pointer;padding:0}
.avatar-wrap{position:relative;flex:0 0 auto;cursor:pointer;border-radius:50%}.avatar-wrap:hover .camera-overlay{opacity:1}.camera-overlay{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:#082b2270;color:#fff;font-size:22px;opacity:0;transition:.18s}.avatar-wrap.no-photo .camera-overlay{opacity:1;background:#082b2238}
.crop-stage{width:min(360px,78vw);height:min(360px,78vw);margin:14px auto;overflow:hidden;border-radius:50%;position:relative;background:#dfe9e4;border:5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.crop-stage img{position:absolute;max-width:none;user-select:none;pointer-events:none;transform-origin:center center}
.range-row{margin:14px 0}.range-row label{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--muted);margin-bottom:6px}.range-row input{width:100%}
.photo-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}


.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.theme-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:15px;cursor:pointer}.theme-card.selected{border-color:var(--o);box-shadow:0 0 0 3px color-mix(in srgb,var(--o) 18%,transparent)}
.swatches{display:flex;gap:6px;margin:10px 0}.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}
.font-options{display:flex;gap:10px;flex-wrap:wrap}.font-choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 15px;cursor:pointer;font-weight:800}.font-choice.selected{border-color:var(--o)}
@media(max-width:760px){.theme-grid{grid-template-columns:1fr 1fr}}

.mobilebar{display:none}
@media(max-width:840px){.main{padding:18px 13px 90px}.hero{padding:22px}.grid4{gap:10px}.card{border-radius:18px;padding:16px}.main{padding-top:20px}.welcome{padding:20px}.welcome h2{font-size:21px}.petname{font-size:35px}.avatar{width:96px;height:96px}.app{display:block}aside{display:none}.main{padding:16px 13px 88px}.grid4,.grid2{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1}.actions{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.top h1{font-size:23px}.mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--g);padding:7px 4px;z-index:10;justify-content:space-around}.mobilebar button{border:0;background:none;color:#fff;font-size:10px;padding:8px 4px}.value{font-size:20px}.petname{font-size:26px}table{display:block;overflow-x:auto}}

.main{padding:0 18px 22px!important;max-width:1050px!important;width:100%!important;margin:0 auto!important}
#central{padding-top:0!important}
.central-exact{background:#fbfaf7}
.central-top{
  height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 8px;
}
.central-main-logo{width:395px;max-width:45%;height:auto;display:block}
.central-quote{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:#223c32;font-size:14px;line-height:1.25;text-align:right;padding-right:8px}
.central-welcome{
  background:#fff;border-radius:17px 17px 0 0;padding:15px 18px 10px;
  display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start;
}
.central-hello{display:flex;gap:13px;align-items:center}
.central-hello-avatar{width:55px;height:55px;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#e8f2ed;display:grid;place-items:center;font-size:25px}
.central-hello-avatar img{width:100%;height:100%;object-fit:cover}
.central-hello h1{margin:0;font-size:34px;color:#102a21;letter-spacing:-.04em;font-weight:950}
.central-hello p{margin:4px 0 0;font-size:15px;color:#425b50}
.central-date{text-align:right;font-size:13px;color:#2b453a;margin-top:0}
.small-care{margin-top:14px;background:#e7f3ed;border-radius:12px;padding:10px 12px;text-align:center;color:#35584a;font-size:11px;line-height:1.3}
.central-profile-row{background:#fff;padding:8px 18px 13px;display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.central-pet-card{border:1px solid #dbe5df;border-radius:14px;padding:12px;display:grid;grid-template-columns:190px 1fr;gap:15px;min-height:240px}
.central-pet-photo-wrap{position:relative;width:190px;height:190px;cursor:pointer}
.central-pet-photo{width:190px;height:190px;border-radius:13px;object-fit:cover;background:#e8f2ed}
.central-pet-camera{position:absolute;right:5px;bottom:5px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#1d7155;color:#fff;border:3px solid #fff;font-size:17px}
.central-pet-name{font-size:29px;font-weight:950;color:#112b21;margin:2px 0 10px}
.central-pet-details{display:grid;grid-template-columns:110px 1fr;gap:8px 8px;font-size:13px}

.central-status{background:#fff;padding:0 18px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cstat{border-radius:12px;padding:15px 14px;min-height:145px}
.cstat.vac{background:#fde6e9}.cstat.con{background:#e2f1fb}.cstat.care{background:#e5f2e7}.cstat.med{background:#fff0d0}
.cstat-title{font-size:11px;font-weight:950;text-transform:uppercase;margin-bottom:12px}.cstat-value{font-size:18px;font-weight:950;margin-bottom:5px}.cstat-sub{font-size:12px;line-height:1.35}.cstat-pill{margin-top:12px;border-radius:999px;background:#ffffff80;text-align:center;padding:6px 8px;font-size:11px;font-weight:800}
.central-summary{background:#fff;padding:0 18px 14px;display:grid;grid-template-columns:1fr 1.05fr 1.05fr;gap:12px}
.csum{border:1px solid #dbe5df;border-radius:13px;padding:16px;min-height:190px;background:#fff}
.csum h3{font-size:16px;margin:0 0 12px;color:#17362b}
.csum-money{font-size:31px;font-weight:950;margin:12px 0}.csum-row{display:flex;gap:8px;align-items:center;margin:9px 0;font-size:12.5px}.checkdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#43b36e;color:white;font-size:12px;font-weight:900}
.central-quick{background:#fff;padding:0 18px 17px;border-radius:0 0 17px 17px}
.central-quick-box{border:1px solid #dbe5df;border-radius:13px;padding:14px}
.central-quick-title{font-size:17px;font-weight:950;color:#17362b}.central-quick-sub{font-size:11px;color:#66786f;margin:2px 0 12px}
.central-quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cquick{border:0;border-radius:11px;min-height:92px;padding:12px 8px;cursor:pointer;font-weight:850;line-height:1.35}
.cquick:nth-child(1),.cquick:nth-child(4){background:#e1f1e6;color:#155f3c}.cquick:nth-child(2){background:#fde2e4;color:#c62945}.cquick:nth-child(3){background:#dff0fb;color:#1660a1}.cquick:nth-child(5){background:#ffefcb;color:#946100}

<script>
const DBNAME='MeuPet360DB', STORE='state';
let db={pet:{},vacinas:[],consultas:[],meds:[],cuidados:[],gastos:[],pesos:[],owner:{nome:'Diego'}};
const pages=[['central','Início','home'],['pet','Meu Pet','paw'],['saude','Saúde','heart'],['rotina','Rotina','calendar'],['gastos','Gastos','coins'],['historico','Relatórios','report'],['aparencia','Configurações','gear']];

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function loadDB(){try{const idb=await openDB();db=await new Promise((resolve,reject)=>{const tx=idb.transaction(STORE,'readonly'),q=tx.objectStore(STORE).get('app');q.onsuccess=()=>resolve(q.result||db);q.onerror=()=>reject(q.error)});idb.close()}catch(e){try{db=JSON.parse(localStorage.getItem('meupet360_backup')||'null')||db}catch(_){}} if(!db.pesos)db.pesos=[];if(!db.owner)db.owner={nome:'Diego'};if(!db.owner.nome)db.owner.nome='Diego';if(!db.settings)db.settings={theme:'original',font:'moderno'};if(!db.owner)db.owner={nome:'Diego'};if(!db.owner.nome)db.owner.nome='Diego'; ensureMultiPet();}
async function persist(showToast=true){syncActivePet();try{const idb=await openDB();await new Promise((resolve,reject)=>{const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(db,'app');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});idb.close();localStorage.setItem('meupet360_backup',JSON.stringify(db));if(showToast)toast('Salvo com sucesso');renderAll()}catch(e){localStorage.setItem('meupet360_backup',JSON.stringify(db));if(showToast)toast('Salvo localmente');renderAll()}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function esc(s=''){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function navIcon(type){
 const common='width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="display:block;fill:white;stroke:white;stroke-width:0"';
 const icons={
  home:`<svg ${common}><path d="M12 3 2.7 10.8h2.7V21h5.2v-5.6h2.8V21h5.2V10.8h2.7L12 3z"/></svg>`,
  paw:`<svg ${common}><ellipse cx="12" cy="16.4" rx="5.7" ry="4.3"/><ellipse cx="5.8" cy="10" rx="2.2" ry="3"/><ellipse cx="10" cy="6.7" rx="2.2" ry="3"/><ellipse cx="14.5" cy="6.7" rx="2.2" ry="3"/><ellipse cx="18.4" cy="10.2" rx="2.2" ry="3"/></svg>`,
  heart:`<svg ${common}><path d="M12 21S3 15.4 3 8.8C3 5.6 5.2 4 7.5 4c1.9 0 3.6 1 4.5 2.6C13 5 14.6 4 16.5 4 18.8 4 21 5.6 21 8.8 21 15.4 12 21 12 21z"/></svg>`,
  calendar:`<svg ${common}><path d="M6 2h2v3h8V2h2v3h3v17H3V5h3V2zm13 8H5v10h14V10z"/></svg>`,
  coins:`<svg ${common}><path d="M12 3C6.5 3 3 4.6 3 6.5S6.5 10 12 10s9-1.6 9-3.5S17.5 3 12 3zm-9 7v3.2c0 1.9 3.5 3.5 9 3.5s9-1.6 9-3.5V10c-2 1.5-5.4 2.2-9 2.2S5 11.5 3 10zm0 6.6v2.9C3 21.4 6.5 23 12 23s9-1.6 9-3.5v-2.9c-2 1.5-5.4 2.2-9 2.2S5 18.1 3 16.6z"/></svg>`,
  report:`<svg ${common}><rect x="3" y="13" width="4" height="8" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>`,
  gear:`<svg ${common}><path d="M19.4 13a7.8 7.8 0 000-2l2-1.6-2-3.4-2.5 1a8 8 0 00-1.7-1L14.8 3h-4l-.4 3a8 8 0 00-1.7 1L6.2 6l-2 3.4 2 1.6a7.8 7.8 0 000 2l-2 1.6 2 3.4 2.5-1a8 8 0 001.7 1l.4 3h4l.4-3a8 8 0 001.7-1l2.5 1 2-3.4-2-1.6zM12.8 16a4 4 0 110-8 4 4 0 010 8z"/></svg>`
 };
 return icons[type]||'';
}

function nav(){const h=pages.map(p=>`<button data-page="${p[0]}" onclick="go('${p[0]}')"><span class="nav-icon-inline">${navIcon(p[2])}</span><span>${p[1]}</span></button>`).join('');document.getElementById('nav').innerHTML=h;document.getElementById('mobileNav').innerHTML=h}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo(0,0)}
function dateBR(v){if(!v)return '—';let [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function age(v){
 if(!v)return '—';
 const b=new Date(v+'T12:00:00'),n=new Date();
 let years=n.getFullYear()-b.getFullYear();
 let months=n.getMonth()-b.getMonth();
 if(n.getDate()<b.getDate())months--;
 if(months<0){years--;months+=12}
 years=Math.max(0,years);
 months=Math.max(0,months);
 if(years===0){
   if(months===0)return 'menos de 1 mês';
   return `${months} ${months===1?'mês':'meses'}`;
 }
 if(months===0)return `${years} ${years===1?'ano':'anos'}`;
 return `${years} ${years===1?'ano':'anos'} e ${months} ${months===1?'mês':'meses'}`;
}
function nextDate(arr,key){const now=new Date();now.setHours(0,0,0,0);return arr.filter(x=>x[key]&&new Date(x[key]+'T12:00:00')>=now).sort((a,b)=>a[key].localeCompare(b[key]))[0]}
function monthSpend(){let n=new Date(),ym=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;return db.gastos.filter(x=>x.data?.startsWith(ym)).reduce((s,x)=>s+(+x.valor||0),0)}
function money(n){return (+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function header(t,s,b=''){return `<div class="top"><div><h1>${t}</h1><div class="sub">${s}</div></div>${b}</div>`}
function imgOrEmoji(){return `<div class="avatar-wrap ${db.pet.foto?'':'no-photo'}" onclick="choosePetPhoto()" title="Clique para alterar a foto">${db.pet.foto?`<img class="avatar" src="${db.pet.foto}">`:`<div class="avatar">🐾</div>`}<div class="camera-overlay">📷</div></div>`}

function daysUntil(v){if(!v)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(v+'T12:00:00');return Math.ceil((b-a)/86400000)}
function alertItems(){let a=[];db.vacinas.forEach(x=>{let d=daysUntil(x.proxima);if(d!==null&&d<=30)a.push({type:'Vacina',name:x.nome,date:x.proxima,d})});db.consultas.forEach(x=>{let d=daysUntil(x.data);if(d!==null&&d>=0&&d<=30)a.push({type:'Consulta',name:x.motivo,date:x.data,d})});db.cuidados.forEach(x=>{let d=daysUntil(x.proxima);if(d!==null&&d<=14)a.push({type:'Cuidado',name:x.servico,date:x.proxima,d})});return a.sort((x,y)=>x.date.localeCompare(y.date))}
function alertText(x){if(x.d<0)return 'Atrasado há '+Math.abs(x.d)+' dia(s)';if(x.d===0)return 'É hoje';if(x.d===1)return 'Falta 1 dia';return 'Faltam '+x.d+' dias'}
function alertLevel(x){if(x.d<0)return ['red','ATRASADO'];if(x.d===0)return ['today','HOJE'];if(x.d<=7)return ['orange','PRÓXIMO'];if(x.d<=30)return ['yellow','ATENÇÃO'];return ['green','TUDO CERTO']}



function centralAlertState(date){
 if(!date) return {cls:'state-neutral',label:'Sem informação'};
 const d=daysUntil(date);
 if(d<0) return {cls:'state-red',label:`Atrasado há ${Math.abs(d)} dia${Math.abs(d)===1?'':'s'}`};
 if(d===0) return {cls:'state-today',label:'É hoje'};
 if(d<=7) return {cls:'state-orange',label:`Falta${d===1?'':'m'} ${d} dia${d===1?'':'s'}`};
 if(d<=30) return {cls:'state-yellow',label:`Em ${d} dias`};
 return {cls:'state-green',label:'Tudo certo'};
}


function healthSummaryItems(){
 const items=[];
 const add=(priority,icon,text,cls='ok')=>items.push({priority,icon,text,cls});

 const vaccines=(db.vacinas||[]).filter(x=>x.proxima);
 const consultations=(db.consultas||[]).filter(x=>x.data);
 const meds=(db.meds||[]).filter(x=>x.nome||x.freq);

 const nextVac=nextDate(vaccines,'proxima');
 const nextCon=nextDate(consultations,'data');

 if(nextVac){
   const d=daysUntil(nextVac.proxima);
   if(d<0)add(100,'⚠',`Vacina atrasada há ${Math.abs(d)} dia${Math.abs(d)===1?'':'s'}`,'danger');
   else if(d===0)add(95,'💉','Vacina marcada para hoje','today');
   else if(d<=7)add(85,'💉',`Vacina em ${d} dia${d===1?'':'s'}`,'warning');
   else add(35,'✓','Vacinas acompanhadas','ok');
 } else {
   add(15,'○','Nenhuma vacina cadastrada','neutral');
 }

 if(nextCon){
   const d=daysUntil(nextCon.data);
   if(d<0)add(90,'⚠',`Consulta atrasada há ${Math.abs(d)} dia${Math.abs(d)===1?'':'s'}`,'danger');
   else if(d===0)add(92,'🩺','Consulta veterinária hoje','today');
   else if(d<=7)add(80,'🩺',`Consulta em ${d} dia${d===1?'':'s'}`,'warning');
   else if(d<=30)add(45,'🩺',`Consulta em ${d} dias`,'info');
   else add(30,'✓','Consultas organizadas','ok');
 } else {
   add(14,'○','Nenhuma consulta futura cadastrada','neutral');
 }

 if(meds.length){
   const names=meds.slice(0,2).map(x=>x.nome).filter(Boolean);
   add(60,'💊',meds.length===1
      ? `${names[0]||'1 medicamento'} em acompanhamento`
      : `${meds.length} medicamentos em acompanhamento`,'info');
 } else {
   add(12,'✓','Nenhum medicamento em acompanhamento','ok');
 }

 const overdueCare=(db.cuidados||[]).filter(x=>x.proxima&&daysUntil(x.proxima)<0);
 if(overdueCare.length){
   add(75,'⚠',`${overdueCare.length} cuidado${overdueCare.length===1?'':'s'} atrasado${overdueCare.length===1?'':'s'}`,'danger');
 }

 const urgent=items.some(x=>x.priority>=75);
 if(!urgent && nextVac && nextCon && !overdueCare.length){
   add(25,'✓','Nenhuma pendência urgente no momento','ok');
 }

 return items.sort((a,b)=>b.priority-a.priority).slice(0,4);
}


function monthOverview(){
 const now=new Date(), ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
 const inMonth=v=>typeof v==='string'&&v.startsWith(ym);

 const careCount=(db.cuidados||[]).filter(x=>inMonth(x.ultima)).length;
 const consultCount=(db.consultas||[]).filter(x=>inMonth(x.data)).length;
 const vaccineCount=(db.vacinas||[]).filter(x=>inMonth(x.ultima)).length;
 const expenseCount=(db.gastos||[]).filter(x=>inMonth(x.data)).length;

 const weights=(db.pesos||[])
   .filter(x=>inMonth(x.data)&&x.peso!==''&&x.peso!=null)
   .sort((a,b)=>(a.data||'').localeCompare(b.data||''));

 let weight='Sem variação de peso';
 if(weights.length>=2){
   const a=Number(String(weights[0].peso).replace(',','.'));
   const b=Number(String(weights[weights.length-1].peso).replace(',','.'));
   if(Number.isFinite(a)&&Number.isFinite(b)){
     const d=b-a;
     weight=`${d>0?'+':''}${d.toFixed(1).replace('.',',')} kg no mês`;
   }
 }else if(weights.length===1) weight='1 peso registrado';

 return {careCount,consultCount,vaccineCount,expenseCount,weight};
}

function openTutorCropper(src){
 const im=new Image();
 im.onload=()=>{
  tutorCropState={src,img:im,zoom:1,x:0,y:0};
  modal('Ajustar sua foto',`
   <div class="photo-editor-layout">
    <div>
      <div class="crop-stage" id="tutorCropStage"><img id="tutorCropImg" src="${src}"></div>
      <div class="photo-hint">A prévia acima mostra exatamente como sua foto ficará.</div>
    </div>
    <div class="photo-editor-controls">
      <div class="photo-editor-help"><b>Ajuste sua foto</b><br>Os controles ficam em destaque para facilitar o enquadramento.</div>
      <div class="range-row"><label><span>Zoom</span><span id="tutorZoomVal">100%</span></label><input id="tutorCropZoom" type="range" min="1" max="3" step=".01" value="1"></div>
      <div class="range-row"><label><span>Horizontal</span><span id="tutorXVal">Centro</span></label><input id="tutorCropX" type="range" min="-100" max="100" value="0"></div>
      <div class="range-row"><label><span>Vertical</span><span id="tutorYVal">Centro</span></label><input id="tutorCropY" type="range" min="-100" max="100" value="0"></div>
      <div class="photo-editor-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveTutorPhoto()">Usar esta foto</button></div>
    </div>
   </div>`, 'photo-editor');
  ['tutorCropZoom','tutorCropX','tutorCropY'].forEach(id=>document.getElementById(id).addEventListener('input',updateTutorCropPreview));
  updateTutorCropPreview();
 };
 im.src=src;
}
function tutorCropMetrics(){
 const st=document.getElementById('tutorCropStage'),size=st.clientWidth,im=tutorCropState.img;
 const base=Math.max(size/im.naturalWidth,size/im.naturalHeight),scale=base*tutorCropState.zoom;
 const w=im.naturalWidth*scale,h=im.naturalHeight*scale,maxX=Math.max(0,(w-size)/2),maxY=Math.max(0,(h-size)/2);
 return{size,w,h,left:(size-w)/2+(tutorCropState.x/100)*maxX,top:(size-h)/2+(tutorCropState.y/100)*maxY};
}
function updateTutorCropPreview(){
 tutorCropState.zoom=+document.getElementById('tutorCropZoom').value;
 tutorCropState.x=+document.getElementById('tutorCropX').value;
 tutorCropState.y=+document.getElementById('tutorCropY').value;
 document.getElementById('tutorZoomVal').textContent=Math.round(tutorCropState.zoom*100)+'%';
 const tx=document.getElementById('tutorXVal'),ty=document.getElementById('tutorYVal');
 if(tx)tx.textContent=tutorCropState.x===0?'Centro':(tutorCropState.x<0?'← Esquerda':'Direita →');
 if(ty)ty.textContent=tutorCropState.y===0?'Centro':(tutorCropState.y<0?'↑ Cima':'Baixo ↓');
 const m=tutorCropMetrics(),el=document.getElementById('tutorCropImg');
 el.style.width=m.w+'px';el.style.height=m.h+'px';el.style.left=m.left+'px';el.style.top=m.top+'px';
}
async function saveTutorPhoto(){
 const m=tutorCropMetrics(),out=640,c=document.createElement('canvas');c.width=c.height=out;
 const ctx=c.getContext('2d'),factor=out/m.size;
 ctx.drawImage(tutorCropState.img,m.left*factor,m.top*factor,m.w*factor,m.h*factor);
 db.owner=db.owner||{}; db.owner.foto=c.toDataURL('image/jpeg',.88);
 closeModal(); await persist(); go('central');
}

 ['cropZoom','cropX','cropY'].forEach(id=>document.getElementById(id).addEventListener('input',updateCropPreview));updateCropPreview()};im.src=src;

function cropMetrics(){const st=document.getElementById('cropStage'),size=st.clientWidth,im=cropState.img,base=Math.max(size/im.naturalWidth,size/im.naturalHeight),scale=base*cropState.zoom,w=im.naturalWidth*scale,h=im.naturalHeight*scale,maxX=Math.max(0,(w-size)/2),maxY=Math.max(0,(h-size)/2),ox=(cropState.x/100)*maxX,oy=(cropState.y/100)*maxY;return{size,w,h,left:(size-w)/2+ox,top:(size-h)/2+oy}}
function updateCropPreview(){cropState.zoom=+document.getElementById('cropZoom').value;cropState.x=+document.getElementById('cropX').value;cropState.y=+document.getElementById('cropY').value;document.getElementById('zoomVal').textContent=Math.round(cropState.zoom*100)+'%';
 const xv=document.getElementById('cropXVal'),yv=document.getElementById('cropYVal');

async function saveCroppedPhoto(){const m=cropMetrics(),out=640,c=document.createElement('canvas');c.width=c.height=out;const ctx=c.getContext('2d'),factor=out/m.size;ctx.drawImage(cropState.img,m.left*factor,m.top*factor,m.w*factor,m.h*factor);db.pet.foto=c.toDataURL('image/jpeg',.88);closeModal();await persist();go('central')}
